<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Atlas — Base de Conocimiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  --hue: 255;
  --blue-600: oklch(0.55 0.18 var(--hue));
  --blue-500: oklch(0.62 0.17 var(--hue));
  --blue-400: oklch(0.72 0.14 var(--hue));
  --blue-100: oklch(0.95 0.03 var(--hue));
  --blue-50:  oklch(0.98 0.015 var(--hue));

  --bg:         oklch(0.995 0.003 var(--hue));
  --bg-sunken:  oklch(0.975 0.008 var(--hue));
  --bg-raised:  #ffffff;
  --surface:    #ffffff;
  --border:     oklch(0.92 0.012 var(--hue));
  --border-strong: oklch(0.86 0.018 var(--hue));
  --text:       oklch(0.22 0.02 var(--hue));
  --text-soft:  oklch(0.45 0.02 var(--hue));
  --text-muted: oklch(0.58 0.015 var(--hue));
  --accent:     var(--blue-600);
  --accent-soft: var(--blue-100);
  --accent-ink: #ffffff;

  --shadow-sm: 0 1px 2px oklch(0.2 0.05 var(--hue) / 0.04);
  --shadow-md: 0 4px 16px oklch(0.2 0.05 var(--hue) / 0.06), 0 1px 2px oklch(0.2 0.05 var(--hue) / 0.04);
  --shadow-lg: 0 24px 60px oklch(0.2 0.1 var(--hue) / 0.12), 0 2px 6px oklch(0.2 0.05 var(--hue) / 0.05);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  --font-ui: 'Inter', system-ui, sans-serif;
  --font-body: 'Source Serif 4', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --space: 1;
  --sidebar-w: 280px;
  --toc-w: 240px;
}

html[data-theme="dark"] {
  --bg:         oklch(0.17 0.02 var(--hue));
  --bg-sunken:  oklch(0.14 0.025 var(--hue));
  --bg-raised:  oklch(0.21 0.025 var(--hue));
  --surface:    oklch(0.21 0.025 var(--hue));
  --border:     oklch(0.28 0.03 var(--hue));
  --border-strong: oklch(0.36 0.04 var(--hue));
  --text:       oklch(0.96 0.01 var(--hue));
  --text-soft:  oklch(0.78 0.02 var(--hue));
  --text-muted: oklch(0.62 0.02 var(--hue));
  --accent:     oklch(0.72 0.15 var(--hue));
  --accent-soft: oklch(0.28 0.08 var(--hue));
  --accent-ink: oklch(0.1 0.02 var(--hue));
  --shadow-md: 0 4px 16px oklch(0 0 0 / 0.4);
  --shadow-lg: 0 24px 60px oklch(0 0 0 / 0.5);
}

html[data-density="compact"] { --space: 0.82; }

html[data-font="serif"] { }
html[data-font="sans"]  { --font-body: 'Inter', system-ui, sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
input, textarea, select { font-family: inherit; color: inherit; }

/* ============ LAYOUT ============ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "brand topbar"
    "sidebar main";
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
  display: grid; place-items: center;
  color: white; font-weight: 700; font-size: 13px;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,.15), 0 1px 2px rgba(30,64,175,.3);
}
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-tag { font-size: 10.5px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }

/* Topbar */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.breadcrumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-soft); flex: 1; min-width: 0; overflow: hidden; }
.breadcrumbs .crumb { white-space: nowrap; }
.breadcrumbs .crumb.active { color: var(--text); font-weight: 500; }
.breadcrumbs .sep { color: var(--text-muted); opacity: 0.6; }
.breadcrumbs a:hover { text-decoration: none; color: var(--accent); }

.search-trigger {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px 6px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-sunken);
  color: var(--text-muted);
  font-size: 13px;
  min-width: 320px;
  transition: border-color .15s, background .15s;
}
.search-trigger:hover { border-color: var(--border-strong); background: var(--surface); }
.search-trigger .kbd {
  margin-left: auto;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 10.5px;
  font-family: var(--font-mono);
  background: var(--surface);
  color: var(--text-soft);
}
html[data-theme="dark"] .search-trigger .kbd { background: var(--bg); }

.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: var(--r-md);
  color: var(--text-soft);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--bg-sunken); color: var(--text); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent); }
.btn-primary {
  padding: 7px 14px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: var(--r-md);
  font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: filter .15s, transform .05s;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:active { transform: translateY(1px); }
.btn-ghost {
  padding: 6px 10px;
  border-radius: var(--r-md);
  font-size: 13px; color: var(--text-soft);
  transition: background .15s, color .15s;
}
.btn-ghost:hover { background: var(--bg-sunken); color: var(--text); }

.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.8 0.1 30), oklch(0.65 0.15 330));
  color: white; font-weight: 600; font-size: 12px;
  display: grid; place-items: center;
  border: 2px solid var(--surface);
  box-shadow: var(--shadow-sm);
}

/* ============ SIDEBAR ============ */
.sidebar {
  grid-area: sidebar;
  border-right: 1px solid var(--border);
  background: var(--bg-sunken);
  overflow-y: auto;
  padding: calc(16px * var(--space)) 0;
  display: flex; flex-direction: column;
  gap: calc(18px * var(--space));
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.nav-group { padding: 0 10px; }
.nav-label {
  padding: 4px 10px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: space-between;
}
.nav-label .count { font-family: var(--font-mono); letter-spacing: 0; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: calc(6px * var(--space)) 10px;
  border-radius: var(--r-sm);
  color: var(--text-soft);
  font-size: 13px;
  cursor: pointer;
  transition: background .12s, color .12s;
  user-select: none;
  position: relative;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.nav-item.active::before {
  content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px;
  width: 3px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.nav-item .ico { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }
.nav-item.active .ico { opacity: 1; }
.nav-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .badge {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--border);
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.nav-item.active .badge { background: var(--accent); color: var(--accent-ink); }

.tree { padding: 0 10px; }
.tree-node { cursor: pointer; user-select: none; }
.tree-row {
  display: flex; align-items: center; gap: 6px;
  padding: calc(5px * var(--space)) 6px;
  border-radius: var(--r-sm);
  font-size: 13px;
  color: var(--text-soft);
  transition: background .12s;
  position: relative;
}
.tree-row:hover { background: var(--bg); color: var(--text); }
.tree-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tree-row.active::before {
  content: ""; position: absolute; left: -10px; top: 5px; bottom: 5px;
  width: 3px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.tree-chev {
  width: 14px; height: 14px; display: grid; place-items: center;
  transition: transform .15s;
  opacity: 0.5;
}
.tree-row:hover .tree-chev { opacity: 1; }
.tree-chev.open { transform: rotate(90deg); }
.tree-chev.leaf { opacity: 0; }
.tree-ico { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent); opacity: 0.85; }
.tree-row.leaf .tree-ico { color: var(--text-muted); opacity: 0.6; }
.tree-row.active .tree-ico { opacity: 1; color: var(--accent); }
.tree-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-count { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
.tree-children { padding-left: 14px; border-left: 1px dashed var(--border); margin-left: 10px; }

/* Tag pills in sidebar */
.tag-cloud {
  padding: 0 10px;
  display: flex; flex-wrap: wrap; gap: 5px;
}
.tag-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px 3px 7px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .12s;
  font-weight: 500;
}
.tag-pill::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: 0.6;
}
.tag-pill:hover { border-color: var(--accent); color: var(--accent); }
.tag-pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag-pill.active::before { background: var(--accent-ink); opacity: 1; }

/* ============ MAIN ============ */
.main {
  grid-area: main;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  position: relative;
  min-width: 0;
}
.sidebar { min-width: 0; }
.main::-webkit-scrollbar { width: 10px; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

.article-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--toc-w);
  max-width: 1180px;
  margin: 0 auto;
  padding: 48px 56px 120px;
  gap: 48px;
}

.article {
  min-width: 0;
}

/* Hero */
.a-hero {
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
}
.a-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  padding: 4px 10px;
  background: var(--accent-soft);
  border-radius: 999px;
}
.a-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.a-title {
  font-family: var(--font-body);
  font-size: 44px;
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 600;
  margin: 0 0 14px;
  color: var(--text);
  text-wrap: pretty;
}
.a-subtitle {
  font-size: 17px;
  color: var(--text-soft);
  line-height: 1.55;
  max-width: 64ch;
  margin: 0 0 22px;
  font-family: var(--font-body);
}
.a-meta {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--text-muted);
}
.a-meta .author-stack { display: flex; align-items: center; gap: 8px; }
.a-meta .avatars { display: flex; }
.a-meta .avatars .avatar { width: 24px; height: 24px; font-size: 10px; margin-right: -6px; border-width: 2px; }
.a-meta .dotsep { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }
.a-meta .tags { display: flex; gap: 5px; flex-wrap: wrap; }

/* Prose */
.prose {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.7;
  color: var(--text);
  max-width: 68ch;
}
.prose > * + * { margin-top: 1.1em; }
.prose h2 {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 26px;
  line-height: 1.25;
  letter-spacing: -0.015em;
  margin-top: 2em;
  margin-bottom: 0.5em;
  scroll-margin-top: 80px;
  color: var(--text);
}
.prose h3 {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.005em;
  margin-top: 1.8em;
  margin-bottom: 0.3em;
  scroll-margin-top: 80px;
  color: var(--text);
}
.prose p { text-wrap: pretty; }
.prose strong { font-weight: 600; color: var(--text); }
.prose em { font-style: italic; }
.prose a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--accent-soft);
  transition: text-decoration-color .15s;
}
html[data-theme="dark"] .prose a { text-decoration-color: color-mix(in oklch, var(--accent) 40%, transparent); }
.prose a:hover { text-decoration-color: var(--accent); }

.prose code {
  font-family: var(--font-mono);
  font-size: 0.87em;
  padding: 1px 6px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--accent);
}
html[data-theme="dark"] .prose code { background: var(--bg-sunken); }

.prose pre {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  padding: 18px 20px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow-x: auto;
  position: relative;
}
.prose pre code {
  background: none; border: none; padding: 0; color: var(--text);
  font-size: inherit;
}
.prose pre .lang-tag {
  position: absolute; top: 8px; right: 10px;
  font-size: 10.5px; font-weight: 500;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em;
}
.tok-kw { color: oklch(0.6 0.2 310); }
.tok-str { color: oklch(0.62 0.15 150); }
.tok-num { color: oklch(0.62 0.17 40); }
.tok-com { color: var(--text-muted); font-style: italic; }
.tok-fn { color: var(--accent); }
html[data-theme="dark"] .tok-kw { color: oklch(0.75 0.2 310); }
html[data-theme="dark"] .tok-str { color: oklch(0.78 0.15 150); }
html[data-theme="dark"] .tok-num { color: oklch(0.78 0.15 40); }

.prose ul, .prose ol { padding-left: 1.4em; }
.prose li { margin-bottom: 0.35em; }
.prose li::marker { color: var(--accent); }

.prose blockquote {
  border-left: 3px solid var(--accent);
  padding: 4px 0 4px 18px;
  color: var(--text-soft);
  font-style: italic;
  margin-left: 0;
}

.callout {
  display: flex; gap: 14px;
  padding: 16px 18px;
  background: var(--accent-soft);
  border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
  border-radius: var(--r-md);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14.5px;
  line-height: 1.55;
}
.callout .ci {
  width: 20px; height: 20px; flex-shrink: 0; color: var(--accent); margin-top: 1px;
}
.callout strong { color: var(--accent); }

.img-placeholder {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background:
    repeating-linear-gradient(45deg, var(--bg-sunken) 0, var(--bg-sunken) 8px, var(--bg) 8px, var(--bg) 16px);
  aspect-ratio: 16 / 9;
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* Feedback */
.feedback {
  margin-top: 56px;
  padding: 24px 28px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg-sunken);
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
}
.feedback-text { font-family: var(--font-ui); font-size: 14px; color: var(--text); font-weight: 500; }
.feedback-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.feedback-btns { display: flex; gap: 8px; }
.feedback-btn {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: 13px; color: var(--text-soft);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .15s;
}
.feedback-btn:hover { border-color: var(--accent); color: var(--accent); }
.feedback-btn.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Related */
.related {
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
}
.related h4 {
  font-family: var(--font-ui);
  font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 16px;
}
.related-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.related-card {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  cursor: pointer;
  transition: all .15s;
  display: flex; flex-direction: column; gap: 6px;
}
.related-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.related-card .r-folder {
  font-size: 10.5px; color: var(--accent); font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.related-card .r-title {
  font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3;
}
.related-card .r-snip { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

/* TOC */
.toc-wrap { position: sticky; top: 32px; align-self: start; }
.toc-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc-list a {
  display: block;
  padding: 5px 10px;
  font-size: 12.5px;
  color: var(--text-muted);
  border-left: 2px solid transparent;
  margin-left: -2px;
  transition: color .15s, border-color .15s;
  line-height: 1.4;
}
.toc-list a:hover { color: var(--text); text-decoration: none; }
.toc-list a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
.toc-list li.h3 a { padding-left: 22px; font-size: 12px; }

.toc-meta {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.toc-meta-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--text-muted);
}
.toc-meta-row .ki { width: 14px; height: 14px; opacity: 0.7; }
.toc-meta-row strong { color: var(--text); font-weight: 500; }

/* ============ SEARCH MODAL ============ */
.search-backdrop {
  position: fixed; inset: 0;
  background: oklch(0.15 0.03 var(--hue) / 0.45);
  backdrop-filter: blur(6px);
  z-index: 80;
  display: grid; place-items: start center;
  padding-top: 12vh;
  animation: fadeIn .15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } }
.search-modal {
  width: min(640px, 92vw);
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: pop .2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop { from { transform: translateY(-8px) scale(.98); opacity: 0; } }
.search-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.search-head input {
  flex: 1;
  border: none; outline: none; background: none;
  font-size: 16px;
  color: var(--text);
}
.search-head input::placeholder { color: var(--text-muted); }
.search-head .esc {
  font-family: var(--font-mono); font-size: 10.5px;
  padding: 3px 7px; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-muted);
}
.search-body { max-height: 60vh; overflow-y: auto; padding: 8px; }
.search-group-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted);
  padding: 10px 12px 6px;
}
.search-result {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background .1s;
}
.search-result:hover, .search-result.focused { background: var(--accent-soft); }
.search-result .si {
  width: 28px; height: 28px; border-radius: 7px;
  display: grid; place-items: center;
  background: var(--bg-sunken); color: var(--accent);
  flex-shrink: 0;
}
.search-result.focused .si { background: var(--accent); color: var(--accent-ink); }
.search-result .sr-main { flex: 1; min-width: 0; }
.search-result .sr-title { font-size: 13.5px; font-weight: 500; color: var(--text); line-height: 1.3; }
.search-result .sr-path { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
.search-result mark { background: color-mix(in oklch, var(--accent) 25%, transparent); color: var(--accent); font-weight: 600; }
.search-foot {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  font-size: 11.5px; color: var(--text-muted);
  background: var(--bg-sunken);
}
.search-foot .k { font-family: var(--font-mono); padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-soft); font-size: 10.5px; }

/* ============ TWEAKS PANEL ============ */
.tweaks-panel {
  position: fixed; bottom: 20px; right: 20px;
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  z-index: 60;
  overflow: hidden;
  animation: slideUp .25s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }
.tweaks-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-sunken);
}
.tweaks-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); }
.tweaks-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.tweak-row {
  display: flex; flex-direction: column; gap: 6px;
}
.tweak-label { font-size: 11.5px; color: var(--text-muted); font-weight: 500; }
.seg {
  display: flex;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  flex: 1; padding: 5px 8px;
  font-size: 11.5px; color: var(--text-soft);
  border-radius: 6px;
  transition: all .12s;
}
.seg button.on {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  font-weight: 500;
}
html[data-theme="dark"] .seg button.on { background: var(--bg-raised); }
.hue-swatches { display: flex; gap: 6px; }
.hue-sw {
  width: 28px; height: 28px; border-radius: 8px;
  border: 2px solid transparent; cursor: pointer;
  transition: transform .1s;
}
.hue-sw:hover { transform: scale(1.1); }
.hue-sw.on { border-color: var(--text); }

/* Floating FAB when panel closed */
.tweaks-fab {
  position: fixed; bottom: 20px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  display: grid; place-items: center;
  color: var(--text-soft);
  z-index: 59;
  transition: transform .15s, color .15s;
}
.tweaks-fab:hover { transform: scale(1.05); color: var(--accent); }

/* Scrollbars for dark */
html[data-theme="dark"] .main::-webkit-scrollbar-thumb,
html[data-theme="dark"] .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); }

/* Misc */
.divider { height: 1px; background: var(--border); margin: 0 14px; }

@media (max-width: 1080px) {
  .article-wrap { grid-template-columns: 1fr; padding: 40px 32px 100px; }
  .toc-wrap { display: none; }
}
@media (max-width: 780px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "brand" "topbar" "main"; grid-template-rows: 56px 56px 1fr; }
  .sidebar { display: none; }
  .article-wrap { padding: 24px 18px 80px; }
  .a-title { font-size: 32px; }
  .search-trigger { min-width: 0; flex: 1; }
}


/* ============ HOME / FAVORITES / RECENT ============ */

.home-wrap, .page-wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 56px 120px;
}

/* HERO */
.home-hero {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  padding: 56px 48px 44px;
  background: linear-gradient(135deg, var(--blue-600), oklch(0.42 0.18 var(--hue)));
  color: white;
  margin-bottom: 48px;
  isolation: isolate;
}
.hh-bg {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.25;
  background:
    radial-gradient(ellipse 600px 300px at 85% 0%, white, transparent 60%),
    radial-gradient(ellipse 400px 200px at 10% 100%, oklch(0.8 0.15 var(--hue)), transparent 60%),
    repeating-linear-gradient(45deg, transparent 0 22px, rgba(255,255,255,0.04) 22px 23px);
}
.hh-inner { position: relative; z-index: 1; }
.home-hero .a-eyebrow {
  background: rgba(255,255,255,0.15);
  color: white;
  border: 1px solid rgba(255,255,255,0.25);
  margin-bottom: 20px;
}
.home-hero .a-eyebrow .dot { background: white; }
.hh-title {
  font-family: var(--font-body);
  font-size: 48px; line-height: 1.15; letter-spacing: -0.025em;
  font-weight: 600; margin: 0 0 20px; text-wrap: balance;
  max-width: 18ch;
}
.hh-title em { font-style: italic; color: oklch(0.92 0.08 var(--hue)); font-weight: 500; }
.hh-sub {
  font-size: 16px; line-height: 1.55; max-width: 56ch;
  color: rgba(255,255,255,0.85); margin: 0 0 28px;
  font-family: var(--font-ui);
}
.hh-cta { display: flex; gap: 10px; margin-bottom: 40px; }
.home-hero .btn-primary {
  background: white; color: var(--blue-600);
}
.home-hero .btn-primary:hover { filter: brightness(0.98); }
.home-hero .btn-ghost {
  color: white; border-color: rgba(255,255,255,0.3) !important;
  background: rgba(255,255,255,0.08);
}
.home-hero .btn-ghost:hover { background: rgba(255,255,255,0.15); color: white; }

.hh-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.2);
}
.hh-stat { padding-right: 20px; border-right: 1px solid rgba(255,255,255,0.15); }
.hh-stat:last-child { border-right: none; }
.hh-stat-val {
  font-family: var(--font-body);
  font-size: 32px; font-weight: 600; letter-spacing: -0.02em;
  line-height: 1;
}
.hh-stat-lbl {
  font-size: 11.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.85); margin-top: 6px;
}
.hh-stat-trend { font-size: 11.5px; color: rgba(255,255,255,0.6); margin-top: 4px; font-family: var(--font-mono); }

/* Section heads */
.home-section { margin-bottom: 40px; }
.home-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 18px;
}
.home-section-head h2 {
  font-family: var(--font-body); font-weight: 600;
  font-size: 22px; letter-spacing: -0.015em; margin: 0; color: var(--text);
}
.home-see-all { font-size: 12.5px; color: var(--text-soft); display: inline-flex; align-items: center; gap: 4px; }
.home-see-all:hover { color: var(--accent); text-decoration: none; }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.cat-card {
  position: relative;
  padding: 22px; border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  text-align: left;
  display: flex; flex-direction: column; gap: 6px;
  transition: all .18s;
  cursor: pointer; overflow: hidden;
}
.cat-card::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--accent-soft), transparent 60%);
  opacity: 0; transition: opacity .2s;
}
.cat-card > * { position: relative; }
.cat-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
.cat-card:hover::before { opacity: 0.6; }
.cat-ico {
  width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  margin-bottom: 8px;
}
.cat-name { font-weight: 600; font-size: 15px; color: var(--text); }
.cat-meta { font-size: 12.5px; color: var(--text-muted); font-family: var(--font-mono); }
.cat-arrow { position: absolute !important; top: 22px; right: 22px; color: var(--text-muted); opacity: 0.5; transition: all .2s; }
.cat-card:hover .cat-arrow { opacity: 1; color: var(--accent); transform: translateX(3px); }

/* Split */
.home-split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; margin-bottom: 40px; }
.home-split .home-section { margin-bottom: 0; }

/* Featured card */
.featured-card {
  border-radius: var(--r-lg); overflow: hidden; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  transition: all .2s;
}
.featured-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.featured-img {
  aspect-ratio: 16 / 11;
  background:
    radial-gradient(ellipse at 70% 30%, var(--blue-400), transparent 60%),
    linear-gradient(135deg, var(--blue-600), oklch(0.35 0.15 var(--hue))),
    repeating-linear-gradient(45deg, transparent 0 16px, rgba(255,255,255,0.06) 16px 17px);
  position: relative; display: flex; align-items: flex-end;
}
.fi-overlay { padding: 24px; color: white; position: relative; z-index: 1; }
.fi-overlay::before {
  content: ""; position: absolute; inset: -24px 0 0 0;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
  z-index: -1;
}
.fi-cat { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; margin-bottom: 8px; }
.fi-title { font-family: var(--font-body); font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.015em; }
.fi-meta { font-size: 12.5px; margin-top: 8px; opacity: 0.8; }

/* Trending list */
.trend-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.trend-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;
}
.trend-row:last-child { border-bottom: none; }
.trend-row:hover { background: var(--accent-soft); }
.trend-num {
  font-family: var(--font-mono); font-size: 13px;
  color: var(--accent); font-weight: 600; width: 24px;
}
.trend-main { flex: 1; min-width: 0; }
.trend-title { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
.trend-path { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.trend-views { color: var(--text-muted); }
.trend-row:hover .trend-views { color: var(--accent); }

/* Quick actions */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick-card {
  display: flex; align-items: flex-start; gap: 12px; text-align: left;
  padding: 14px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--surface);
  transition: all .15s;
}
.quick-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.quick-card > svg { color: var(--accent); margin-top: 2px; flex-shrink: 0; }
.quick-card strong { display: block; font-size: 13.5px; color: var(--text); font-weight: 600; margin-bottom: 2px; }
.quick-card span { display: block; font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
.kbd-inline { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 3px; color: var(--text-soft); margin-left: 4px; }

/* Home tags */
.home-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 18px; border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface);
  align-items: center;
}
.home-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--bg-sunken); border: 1px solid var(--border);
  color: var(--text); font-weight: 500;
  transition: all .12s;
}
.home-tag:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ht-hash { color: var(--accent); opacity: 0.7; }
.ht-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

/* ============ PAGE (Fav / Recent) ============ */
.page-head { margin-bottom: 32px; }
.page-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 14px;
  padding: 4px 10px; background: var(--accent-soft); border-radius: 999px;
}
.page-title {
  font-family: var(--font-body); font-size: 40px; line-height: 1.1; letter-spacing: -0.02em;
  font-weight: 600; margin: 0 0 12px; color: var(--text);
}
.page-sub { font-family: var(--font-body); font-size: 16px; color: var(--text-soft); margin: 0 0 22px; max-width: 64ch; line-height: 1.55; }
.page-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px;
  background: var(--bg-sunken); border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.mini-search {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
  min-width: 240px; color: var(--text-muted);
}
.mini-search input {
  border: none; outline: none; background: none; flex: 1;
  font-size: 13px; color: var(--text);
}
.page-count { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

/* Favorites */
.fav-section { margin-bottom: 32px; }
.fav-section-head {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 14px;
  display: inline-flex; align-items: center; gap: 6px;
}
.fav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.fav-card {
  padding: 18px; border-radius: var(--r-lg);
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; transition: all .18s;
  display: flex; flex-direction: column; gap: 10px;
  position: relative;
}
.fav-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
.fav-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fav-cat { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.fav-star {
  width: 28px; height: 28px; border-radius: 7px;
  display: grid; place-items: center;
  color: var(--text-muted); background: transparent;
  transition: all .12s;
}
.fav-star:hover { background: var(--accent-soft); color: var(--accent); }
.fav-star.on { color: oklch(0.68 0.17 75); }
.fav-star.on svg { fill: oklch(0.72 0.17 75); }
.fav-title { font-family: var(--font-body); font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--text); letter-spacing: -0.01em; }
.fav-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.fav-note {
  padding: 10px 12px;
  background: var(--accent-soft);
  border-radius: var(--r-sm);
  font-family: var(--font-body); font-style: italic;
  font-size: 13px; color: var(--text-soft); line-height: 1.5;
}
.fav-foot {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--text-muted);
  padding-top: 8px; border-top: 1px dashed var(--border);
  margin-top: 2px;
}

.fav-list { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.fav-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;
}
.fav-row:last-child { border-bottom: none; }
.fav-row:hover { background: var(--accent-soft); }
.fav-row-main { flex: 1; min-width: 0; }
.fav-row-title { font-size: 14px; font-weight: 500; color: var(--text); }
.fav-row-path { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }
.fav-row-date { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }

/* Recent / Timeline */
.timeline { position: relative; }
.tl-group { margin-bottom: 32px; }
.tl-label {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 14px; padding-left: 36px;
}
.tl-list { position: relative; }
.tl-list::before {
  content: ""; position: absolute; left: 13px; top: 12px; bottom: 12px;
  width: 2px; background: var(--border); border-radius: 1px;
}
.tl-item {
  display: flex; gap: 16px; position: relative; cursor: pointer;
  margin-bottom: 10px;
}
.tl-dot-wrap { position: relative; width: 28px; flex-shrink: 0; padding-top: 20px; }
.tl-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--accent);
  margin-left: 8px;
  box-shadow: 0 0 0 4px var(--bg);
  position: relative; z-index: 1;
}
.tl-dot.done { background: var(--accent); }
.tl-card {
  flex: 1; padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: all .15s;
  min-width: 0;
}
.tl-item:hover .tl-card { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateX(3px); }
.tl-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.tl-cat { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.tl-at { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
.tl-title { font-family: var(--font-body); font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text); letter-spacing: -0.005em; margin-bottom: 8px; }
.tl-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.tl-progress { display: flex; align-items: center; gap: 10px; }
.tl-bar { flex: 1; height: 4px; background: var(--bg-sunken); border-radius: 2px; overflow: hidden; }
.tl-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
.tl-pct { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); white-space: nowrap; }

/* Empty states */
.empty {
  text-align: center; padding: 80px 20px;
  border: 1px dashed var(--border); border-radius: var(--r-lg);
  background: var(--bg-sunken);
}
.empty-ico {
  width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center; margin: 0 auto 16px;
